[project]
name = "sql-model"
version = "0.1.0"
description = "Shared persistence layer using SQLModel and SQLAlchemy async"
readme = "README.md"
authors = [
    { name = "Vishwa Kumaran", email = "vishwaa33400@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "greenlet>=3.5.3",
    "pydantic-settings>=2.14.2",
    "sqlmodel>=0.0.39",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true
